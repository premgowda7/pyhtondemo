_format_version: "3.0"

services:
  - name: web
    url: http://web:8080
    routes:
      - name: web
        paths: ["/"]
  - name: orders-api
    url: http://orders-api:8080
    routes:
      - name: orders-api
        paths: ["/api"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }

plugins:
  - name: correlation-id
    config: { header_name: X-Request-ID, generator: uuid, echo_downstream: true }
