# DevSecOps: secrets, SAST, IaC misconfiguration and dependency checks.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"   # weekly - catches newly published CVEs in unchanged code

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the last commit
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  iac:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Render Helm chart for scanning
        run: |
          mkdir -p rendered
          for s in orders-api worker web; do
            helm template $s deploy/charts/microservice -n orders \
              -f deploy/envs/dev/global.yaml -f deploy/envs/dev/$s.yaml > rendered/$s.yaml
          done
      - name: Checkov (Terraform + Kubernetes + GitHub Actions)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,github_actions,dockerfile
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  dependencies:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
