# Build -> push to private ACR -> bump image tags in Git. ArgoCD notices the commit and deploys (GitOps).
# CI never talks to the Kubernetes API, which is what makes a fully private AKS cluster practical.
name: release

on:
  push:
    branches: [main]
    paths: ["services/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-push:
    if: vars.AZURE_CLIENT_ID != ''   # skipped until scripts/bootstrap-azure.sh has been run
    name: build & push (${{ matrix.service }})
    runs-on: ${{ vars.PRIVATE_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev-release    # no reviewers; scopes the OIDC subject
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [orders-api, worker, web]
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login (Entra token, no admin user)
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v3
      - name: Build & push (with SBOM + provenance attestations)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy gate on the pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  promote:
    name: promote to dev (GitOps)
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tags
        run: |
          for s in orders-api worker web; do
            yq -i ".image.tag = \"${GITHUB_SHA}\"" deploy/envs/dev/$s.yaml
          done
          git diff --stat
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): deploy ${GITHUB_SHA::7} to dev" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
