# Pull-request quality gate: lint, unit tests, container build + vulnerability scan, Helm render/validate.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, worker, web]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest==8.3.3 httpx==0.27.2 ruff==0.7.2
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q

  image:
    name: image scan (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy - report (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Trivy - gate on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Lint + render + schema-validate every service
        run: |
          set -euo pipefail
          for s in orders-api worker web; do
            helm lint deploy/charts/microservice --set nameOverride=$s -f deploy/envs/dev/global.yaml -f deploy/envs/dev/$s.yaml
            helm template $s deploy/charts/microservice -n orders \
              -f deploy/envs/dev/global.yaml -f deploy/envs/dev/$s.yaml > rendered-$s.yaml
          done
          # CRDs (KongPlugin, SecretProviderClass, ...) validated against the community CRD catalog
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-*.yaml deploy/platform/namespaces/*.yaml
