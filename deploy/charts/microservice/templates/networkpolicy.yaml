{{- if .Values.networkPolicy.enabled }}
# Ingress allow-list. Anything not listed (other app pods, other namespaces) is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "microservice.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.allowFromKong }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.kongNamespace }}}
      ports: [{port: {{ .Values.containerPort }}, protocol: TCP}]
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}}
      ports: [{port: {{ .Values.containerPort }}, protocol: TCP}]
    {{- end }}
{{- end }}
