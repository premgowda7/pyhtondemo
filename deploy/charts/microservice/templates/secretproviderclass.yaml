{{- if .Values.keyVault.enabled }}
{{- $clientId := include "microservice.clientId" . | required "keyVault.enabled needs a workload identity client ID" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "microservice.name" . }}-kv
  namespace: {{ .Release.Namespace }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ $clientId | quote }}          # workload identity (federated token, no secrets)
    keyvaultName: {{ .Values.global.keyVaultName | required "global.keyVaultName is required" | quote }}
    tenantId: {{ .Values.global.tenantId | required "global.tenantId is required" | quote }}
    objects: |
      array:
      {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ . }}
          objectType: secret
      {{- end }}
{{- end }}
