{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    konghq.com/strip-path: "false"
    {{- with .Values.kongPlugins }}
    konghq.com/plugins: {{ keys . | sortAlpha | join "," | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ tpl . $ | quote }}
      {{- end }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "microservice.name" $ }}
                port: {name: http}
          {{- end }}
---
{{- range $name, $p := .Values.kongPlugins }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "microservice.labels" $ | nindent 4 }}
plugin: {{ $p.plugin }}
{{- with $p.config }}
config: {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
{{- end }}
