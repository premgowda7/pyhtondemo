{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
  {{- with include "microservice.clientId" . }}
  annotations:
    # Federated credential subject must be system:serviceaccount:<namespace>:<this name>
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
