# One Application per microservice, same chart, per-service values.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orders-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - service: orders-api
          - service: worker
          - service: web
  template:
    metadata:
      name: "{{.service}}-dev"
      labels: {app.kubernetes.io/part-of: orders-platform}
    spec:
      project: orders-apps
      source:
        repoURL: https://github.com/premgowda7/pyhtondemo.git
        targetRevision: main
        path: deploy/charts/microservice
        helm:
          releaseName: "{{.service}}"
          valueFiles:
            - ../../envs/dev/global.yaml
            - "../../envs/dev/{{.service}}.yaml"
      destination: {server: https://kubernetes.default.svc, namespace: orders}
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
