# Helm values for argo-cd chart 10.12.0 (installed once by scripts/bootstrap-cluster.sh)
global:
  domain: argocd.internal.example.com   # TODO: your internal DNS name
configs:
  params:
    server.insecure: false
  cm:
    # Hide secrets of tracked resources in diffs/UI.
    resource.exclusions: |
      - apiGroups: ["cilium.io"]
        kinds: ["CiliumIdentity"]
        clusters: ["*"]
    # TODO (prod): Entra ID SSO via OIDC instead of the local admin account
    admin.enabled: "true"
  rbac:
    policy.default: role:readonly
server:
  service:
    type: ClusterIP            # no public exposure: kubectl port-forward or internal Ingress only
redis-ha:
  enabled: false
controller:
  replicas: 1
repoServer:
  replicas: 2
applicationSet:
  replicas: 1
